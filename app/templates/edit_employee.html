<!DOCTYPE html>
<html>
<head>
    <title>Редактировать сотрудника</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; background: #ffe6e6; padding: 10px; margin-bottom: 15px; }
        .btn-back { background: #6c757d; margin-right: 10px; }
        .current-photo { max-width: 100px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Редактировать сотрудника: {{ employee.username }}</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if employee.photo %}
    <div>
        <strong>Текущее фото:</strong><br>
        <img src="{{ employee.photo }}" class="current-photo" alt="{{ employee.username }}">
    </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="username">ФИО:</label>
            <input type="text" id="username" name="username" value="{{ employee.username }}" required>
        </div>

        <div class="form-group">
            <label for="date_of_birth">Дата рождения:</label>
            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ employee.date_of_birth }}" required>
        </div>

        <div class="form-group">
            <label for="department">Отдел:</label>
            <input type="text" id="department" name="department" value="{{ employee.department }}" required>
        </div>

        <div class="form-group">
            <label for="job_title">Должность:</label>
            <input type="text" id="job_title" name="job_title" value="{{ employee.job_title }}" required>
        </div>

        <div class="form-group">
            <label for="salary">Зарплата:</label>
            <input type="number" id="salary" name="salary" value="{{ employee.salary }}" required>
        </div>

        <div class="form-group">
            <label for="bet">Ставка (0-2):</label>
            <select id="bet" name="bet" required>
                <option value="0" {% if employee.bet == 0 %}selected{% endif %}>0</option>
                <option value="1" {% if employee.bet == 1 %}selected{% endif %}>1</option>
                <option value="2" {% if employee.bet == 2 %}selected{% endif %}>2</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Статус:</label>
            <select id="status" name="status" required>
                <option value="active" {% if employee.status == 'active' %}selected{% endif %}>Active</option>
                <option value="vacation" {% if employee.status == 'vacation' %}selected{% endif %}>Vacation</option>
                <option value="fired" {% if employee.status == 'fired' %}selected{% endif %}>Fired</option>
                <option value="sick" {% if employee.status == 'sick' %}selected{% endif %}>Sick</option>
            </select>
        </div>

        <div class="form-group">
            <label for="photo">Новая фотография:</label>
            <input type="file" id="photo" name="photo" accept="image/*">
        </div>

        <div>
            <a href="/employee/{{ employee.id }}" class="btn btn-back">Назад</a>
            <button type="submit">Сохранить изменения</button>
        </div>
    </form>
</body>
</html>
